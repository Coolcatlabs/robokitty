name: pre-commit

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'setup.py'

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
